plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
}

group = 'br.com.backup'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

tasks.named('test') {
    useJUnitPlatform()
}

// Contrato de API (OpenAPI) versionado no repositório — fonte da verdade para qualquer
// client (frontend, agentes de IA). Gerado sem tocar em Postgres nem em pg_dump: o serviço
// só monta os beans (o diretório de backups aponta pra um temporário). Porta 7099 pra não
// disputar a 7058 com o container local.
openApi {
    apiDocsUrl.set("http://localhost:7099/v3/api-docs.yaml")
    outputDir.set(file("$rootDir/openapi"))
    outputFileName.set("openapi.yaml")
    waitTimeInSeconds.set(60)
    customBootRun {
        args.set([
                "--spring.profiles.active=dev",
                "--server.port=7099",
                "--backup.dir=${System.getProperty('java.io.tmpdir')}/backup-service-openapi"
        ])
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
