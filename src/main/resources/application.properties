spring.application.name=backup-service
spring.profiles.active=${PROFILE_ACTIVE:dev}
spring.threads.virtual.enabled=true
server.port=${PORT:7058}
springdoc.writer-with-order-by-keys=true

# --- Backup do Postgres (pg_dump --format=custom, todos os schemas do banco) ---
# Diretório onde os arquivos ficam (dentro do container; o compose liga ./backups do host aqui).
backup.dir=${BACKUP_DIR:/backups}
# Caminho no HOST exibido na tela pra você achar o arquivo (o container só enxerga /backups).
backup.host-dir=${BACKUP_HOST_DIR:}
backup.pg-dump-binary=${PG_DUMP_BINARY:pg_dump}
backup.openssl-binary=${OPENSSL_BINARY:openssl}
# Role dedicado (pg_read_all_data), nunca o superusuário. Senha só por env, nunca em log.
backup.pg.host=${PGHOST:localhost}
backup.pg.port=${PGPORT:7050}
backup.pg.database=${PGDATABASE:workbox}
backup.pg.user=${PGUSER:backup_service}
backup.pg.password=${PGPASSWORD:backup_service}
# Tamanho mínimo da senha de cifra opcional.
backup.min-passphrase-length=12

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Introspecção no workbox-api (client credentials) — mesmo padrão dos outros resource servers.
introspection.uri=${INTROSPECTION_URI:http://localhost:7051/api/v1/auth/introspect}
introspection.client-id=${INTROSPECTION_CLIENT_ID:backup-service}
introspection.client-secret=${INTROSPECTION_CLIENT_SECRET:MyS3cur3Cli3ntS3cr3t!B4ckup!}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:7053,http://127.0.0.1:7053}
